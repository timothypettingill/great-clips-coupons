<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Great Clips Coupons</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
            /* Define brand colors as CSS variables */
            --color-brand: #048667;       /* Great Clips Green */
            --color-brand-dark: #036b52;
            --color-brand-light: #05a17c;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 antialiased" x-data="{ 
          coupons: [], 
          lastUpdated: 'Loading date...',
          isLoading: true,
          error: null,
          showUSOnly: false,
          get filteredCoupons() {
              if (!this.showUSOnly) return this.coupons;
              return this.coupons.filter(coupon => 
                  coupon.description && coupon.description.toLowerCase().includes('participating us area great clips salons')
              );
          },
          async init() {
              try {
                  const response = await fetch('https://raw.githubusercontent.com/timothypettingill/great-clips-coupons/refs/heads/main/data/coupon_data.json');
                  if (!response.ok) throw new Error('Failed to fetch coupons');
                  
                  const json = await response.json();
                  
                  // New Schema: Coupons are in the 'data' key
                  this.coupons = json.data;
                  
                  // New Schema: Metadata timestamp
                  if (json.metadata && json.metadata.generated_at) {
                      const date = new Date(json.metadata.generated_at);
                      this.lastUpdated = date.toLocaleDateString(undefined, { 
                          weekday: 'long', 
                          year: 'numeric', 
                          month: 'long', 
                          day: 'numeric' 
                      }) + ' at ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                  } else {
                      this.lastUpdated = 'Date unavailable';
                  }

              } catch (err) {
                  this.error = err.message;
                  this.lastUpdated = 'Error fetching date';
              } finally {
                  this.isLoading = false;
              }
          }
      }">

    <div class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">
        <div class="max-w-4xl mx-auto mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-brand tracking-tight sm:text-5xl">
                Active Great Clips Coupons
            </h1>
            <p class="mt-4 text-lg text-gray-600 font-medium">
                Last Updated: <span x-text="lastUpdated"></span>
            </p>
        </div>

        <div x-show="!isLoading && !error" class="max-w-4xl mx-auto mb-6">
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" x-model="showUSOnly"
                    class="w-4 h-4 text-brand rounded border-gray-300 focus:ring-brand">
                <span class="text-sm font-medium text-gray-700">Show coupons that are valid at any participating Great
                    Clips salon in the United States</span>
            </label>
        </div>

        <div x-show="isLoading" class="max-w-4xl mx-auto text-center py-12" style="display: none;">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand border-r-transparent">
            </div>
            <p class="mt-2 text-brand font-medium">Loading coupons...</p>
        </div>

        <div x-show="error" class="max-w-4xl mx-auto bg-red-50 border-l-4 border-red-500 p-4 mb-8"
            style="display: none;">
            <div class="flex">
                <div class="ml-3">
                    <p class="text-sm text-red-700" x-text="'Error loading data: ' + error"></p>
                </div>
            </div>
        </div>

        <div x-show="!isLoading && !error" class="max-w-4xl mx-auto space-y-8">
            <template x-for="(coupon, index) in filteredCoupons" :key="index">

                <div
                    class="bg-white shadow-sm overflow-hidden sm:rounded-lg border border-gray-200 hover:shadow-md transition-shadow duration-300">

                    <div
                        class="px-4 py-5 sm:px-6 bg-brand/5 border-b border-gray-200 flex justify-between items-center gap-4">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-brand-dark">
                                <a :href="coupon.url" target="_blank"
                                    class="hover:underline flex items-center gap-2 group">
                                    <span x-text="coupon.url"></span>
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="h-5 w-5 text-brand group-hover:text-brand-dark transition-colors"
                                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                    </svg>
                                </a>
                            </h3>
                        </div>
                        <span
                            class="inline-flex items-center rounded-full bg-brand-light px-4 py-2 text-sm font-semibold text-white whitespace-nowrap"
                            x-text="coupon.price">
                        </span>
                    </div>

                    <div class="border-t border-gray-200 px-4 py-5 sm:p-0">
                        <dl class="sm:divide-y sm:divide-gray-200">

                            <div class="py-4 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                                <dt class="text-sm font-medium text-gray-500">
                                    Price
                                </dt>
                                <dd class="mt-1 text-sm font-semibold text-brand sm:mt-0 sm:col-span-2"
                                    x-text="coupon.price">
                                </dd>
                            </div>

                            <div class="py-4 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6 bg-gray-50">
                                <dt class="text-sm font-medium text-gray-500">
                                    Expires On
                                </dt>
                                <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">
                                    <span x-text="coupon.expriation_date || coupon.expiration_date"></span>
                                </dd>
                            </div>

                            <div class="py-4 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                                <dt class="text-sm font-medium text-gray-500">
                                    Description
                                </dt>
                                <dd class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2"
                                    x-text="coupon.description">
                                </dd>
                            </div>

                            <div class="py-4 sm:py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6 bg-gray-50">
                                <dt class="text-sm font-medium text-gray-500">
                                    Terms & Conditions
                                </dt>
                                <dd class="mt-1 text-xs text-gray-500 sm:mt-0 sm:col-span-2 italic"
                                    x-text="coupon.terms_and_conditions">
                                </dd>
                            </div>

                        </dl>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="!isLoading && !error && filteredCoupons.length === 0" class="max-w-4xl mx-auto text-center py-12"
            style="display: none;">
            <p class="text-gray-500" x-text="showUSOnly ? 'No active coupons found.' : 'No active coupons found.'">
            </p>
        </div>

    </div>

</body>

</html>
