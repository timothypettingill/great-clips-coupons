name: Update Data

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies with uv
        run: uv sync

      - name: Install browser for playwright
        run: uv run playwright install chromium
      
      - name: Run fetch_coupon_urls.py
        run: uv run scripts/fetch_coupon_urls.py
      
      - name: Run fetch_coupon_data.py
        run: uv run scripts/fetch_coupon_data.py
      
      - name: Add, commit, and push changes
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email ""41898282+github-actions[bot]@users.noreply.github.com""
          git add -A
          timestamp=$(date -u)
          git commit -m "Update data: ${timestamp}" || exit 0
          git pull --rebase
          git push

